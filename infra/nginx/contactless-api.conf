# Nginx Reverse Proxy Configuration for Dedicated Contactless API EC2
# Subdomain: contactless-api.sharonteastall.com -> PM2 (127.0.0.1:4100)

upstream sharon_contactless_api {
    server 127.0.0.1:4100;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name contactless-api.sharonteastall.com;

    # Redirect HTTP to HTTPS (uncomment after Certbot SSL provisioning)
    # return 301 https://$host$request_uri;

    location /socket.io/ {
        proxy_pass http://sharon_contactless_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://sharon_contactless_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}

